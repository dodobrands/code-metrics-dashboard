name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: bitrise_pool_name:pizza-ubuntu-xs
    steps:
      - uses: actions/checkout@v4
      # index.html is a template — build_roadmap.py fills the roadmap region at
      # deploy time. The committed source must keep empty markers; otherwise
      # generated markup leaked into git.
      - name: index.html keeps an empty roadmap
        run: |
          if grep -q '<!--roadmap:board:start--><!--roadmap:board:end-->' index.html \
            && grep -q '<!--roadmap:dialogs:start--><!--roadmap:dialogs:end-->' index.html; then
            exit 0
          fi
          echo "::error::index.html has a filled roadmap region — commit the empty template (git checkout index.html)"
          exit 1
      # mcm (in mise.toml) is a private cross-org release — mise needs a token
      # that can read it, or the install step fails.
      - uses: jdx/mise-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.MOBILE_CODE_METRICS_DASHBOARD }}
      - run: npm ci
      - run: biome check .
      - run: html-validate index.html
      - run: ruff check data
      - run: actionlint
      - run: node scripts/typography.mjs
