name: Lint

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pages are stamped from templates/ at build time. The template must keep the
      # roadmap markers empty, and no generated index.html may be tracked.
      - name: templates keep an empty roadmap, generated pages stay untracked
        run: |
          grep -q '<!--roadmap:board:start--><!--roadmap:board:end-->' templates/app.html
          grep -q '<!--roadmap:dialogs:start--><!--roadmap:dialogs:end-->' templates/app.html
          if git ls-files | grep -Ex '([^/]+/)?index\.html'; then
            echo "::error::a generated index.html is tracked — pages come from templates/ (see scripts/render-pages.mjs)"
            exit 1
          fi
      # codemetrics (in mise.toml) is a private cross-org release — mise needs a token
      # that can read it, or the install step fails. Pass it through the action's
      # github_token input, not env: the action exports MISE_GITHUB_TOKEN from
      # that input (defaulting to the repo-scoped github.token), and
      # MISE_GITHUB_TOKEN outranks GITHUB_TOKEN in mise's token lookup.
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.CODE_METRICS_DASHBOARD }}
      - run: npm ci
      - run: biome check .
      - run: node scripts/render-pages.mjs
      - run: html-validate index.html */index.html
      - run: actionlint
      - run: node scripts/typography.mjs
      - run: node scripts/latin-only.mjs
      - run: node scripts/typo.test.mjs
      - run: node scripts/layout.test.mjs
      # The whole per-app pipeline on a fixture, in a scratch copy — needs swift (from mise).
      - run: bash scripts/layout-dry-run.sh
