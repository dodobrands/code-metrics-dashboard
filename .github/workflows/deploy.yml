name: Deploy

on:
  schedule:
    - cron: "17 5 * * *" # daily 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Dormant until infra secrets exist — set repo variable DEPLOY_ENABLED=true to arm.
    # Needs secrets: MCM_INSTALL_TOKEN (PAT, read private mcm release), MCM_URL, MCM_READ_TOKEN.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # mcm is installed via mise from its GitHub release (private, cross-org →
      # GITHUB_TOKEN must read dodo-ai-platform/mobile-code-metrics).
      - uses: jdx/mise-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.MCM_INSTALL_TOKEN }}
        with:
          mise_toml: |
            [tools]
            python = "3"
            "ubi:dodo-ai-platform/mobile-code-metrics" = { version = "0.1.0", exe = "mcm", matching = "linux_x86_64" }

      - name: Fetch + build metrics
        env:
          MCM_URL: ${{ secrets.MCM_URL }}
          MCM_TOKEN: ${{ secrets.MCM_READ_TOKEN }}
        run: |
          mcm get --repo dodobrands/dodo-mobile-ios > data/raw.json
          python data/build.py data/raw.json
          rm -f data/raw.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
