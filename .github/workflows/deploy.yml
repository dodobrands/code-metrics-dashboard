name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # daily 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Needs secrets: CODE_METRICS_DASHBOARD (PAT, read private codemetrics release), CODEMETRICS_URL, CODEMETRICS_READ_TOKEN.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # All tooling (node, esbuild, linters, swift, python, codemetrics) comes from mise.toml.
      # codemetrics is a private cross-org release, so mise needs a token that can read it.
      # Pass it through the action's github_token input, not env: the action exports
      # MISE_GITHUB_TOKEN from that input (defaulting to the repo-scoped
      # github.token), and MISE_GITHUB_TOKEN outranks GITHUB_TOKEN in mise.
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.CODE_METRICS_DASHBOARD }}

      - run: npm ci
      - run: bash scripts/build.sh

      - name: Fetch + build metrics
        env:
          CODEMETRICS_URL: ${{ secrets.CODEMETRICS_URL }}
          CODEMETRICS_TOKEN: ${{ secrets.CODEMETRICS_READ_TOKEN }}
          # Distributed tracing: ship the CLI's client spans to alloy-frontend, so a
          # dashboard build traces the `codemetrics get` end to end (CLI -> code-metrics).
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.ALLOY_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer ${{ secrets.ALLOY_OTLP_TOKEN }}"
          OTEL_SERVICE_NAME: codemetrics
        run: |
          mkdir -p data   # data/ holds only generated (gitignored) files, so it's absent on checkout
          codemetrics get --repo dodobrands/dodo-mobile-ios > data/raw.json
          swift run --package-path Tools/DashboardBuild build data/raw.json
          swift run --package-path Tools/DashboardBuild build-roadmap
          rm -f data/raw.json

      # Render the Open Graph share cards from og.json (gitignored build output).
      # ImageMagick via mise (aqua, linux-only — fine on this runner); the mono
      # font is the one system package that can't come through mise.
      - name: Generate share images
        run: |
          sudo apt-get install -y -qq fonts-dejavu-core
          mise x "aqua:ImageMagick/ImageMagick@latest" -- bash scripts/og-image.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
