[settings]
lockfile = true
# mcm ships fresh releases; exempt it from mise's minimum-release-age gate so
# `@latest` resolves the newest tag instead of the CI install failing with
# "no versions matching date filter".
minimum_release_age_excludes = ["github:dodo-ai-platform/mobile-code-metrics"]

# All tooling installs through mise, everywhere (local, lint CI, deploy) — mise's
# cache makes reinstalling the full set cheap, so we never scope tools per-env.
# Rule (every tool, no exceptions — mcm included): always request "latest" here
# and let mise.lock pin the exact version. Never hardcode a version in this file;
# bump with `mise up`, which rewrites the lock. Browser libraries (Chart.js,
# typopo) are npm dependencies in package.json instead — see README.
[tools]
node = "latest"
ruff = "latest"
actionlint = "latest"
python = "latest"
"npm:@biomejs/biome" = "latest"
"npm:html-validate" = "latest"
"npm:esbuild" = "latest"
"github:dodo-ai-platform/mobile-code-metrics" = { version = "latest", bin = "mcm" }
