[settings]
lockfile = true

[tools]
node = "22"
ruff = "latest"
actionlint = "latest"
"npm:@biomejs/biome" = "latest"
"npm:html-validate" = "latest"

[tasks.lint]
description = "Lint everything: JS/CSS (biome), HTML (html-validate), Python (ruff), workflows (actionlint)"
run = [
  "biome check .",
  "html-validate index.html",
  "ruff check data",
  "actionlint",
]
